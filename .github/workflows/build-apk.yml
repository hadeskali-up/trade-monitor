name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Rename APK for release
        run: |
          APK_PATH=$(ls composeApp/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK_PATH" ./trade-monitor.apk
          echo "APK prepared: $(ls -lh ./trade-monitor.apk)"

      - name: Create / Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-$(date +'%Y%m%d-%H%M')"
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest ./trade-monitor.apk \
            --title "Trade Monitor — Latest Build" \
            --notes "Built from commit ${{ github.sha }} on $(date +'%Y-%m-%d %H:%M UTC')"

      - name: Upload to temp.sh (backup URL)
        run: |
          APK_PATH=$(find . -name "*debug.apk" | head -1)
          RESPONSE=$(curl -s -F "file=@$APK_PATH" https://temp.sh/upload)
          echo "Download URL: $RESPONSE"
